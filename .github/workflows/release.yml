name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: paperrl-desktop-x86_64-windows
            bin: paperrl-desktop.exe
            archive: zip
          - os: ubuntu-latest
            asset: paperrl-desktop-x86_64-linux
            bin: paperrl-desktop
            archive: tar.gz
          - os: macos-latest
            asset: paperrl-desktop-aarch64-macos
            bin: paperrl-desktop
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system libraries (GTK + WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop app
        run: cargo build --release -p paperrl-desktop
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage/${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/paperrl-desktop.exe "$stage/"
          Copy-Item README.md "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.asset }}.zip"
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage/${{ matrix.asset }}
          cp target/release/paperrl-desktop stage/${{ matrix.asset }}/
          cp README.md stage/${{ matrix.asset }}/
          tar czf ${{ matrix.asset }}.tar.gz -C stage ${{ matrix.asset }}
      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          files: ${{ matrix.asset }}.*
