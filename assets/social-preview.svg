<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-green" cx="0.86" cy="0.04" r="0.62">
      <stop offset="0" stop-color="#08B98B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#08B98B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="0.02" cy="0.98" r="0.5">
      <stop offset="0" stop-color="#F5B94C" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#F5B94C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08B98B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#08B98B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0B1220"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow-green)"/>
  <rect width="1280" height="640" fill="url(#glow-gold)"/>

  <g transform="translate(96, 88) scale(1.125)" fill="#EAF2F7">
    <path d="M12 5 H32 L40 13 V25 H12 Z"/>
    <path d="M32 5 V13 H40 Z" opacity="0.55"/>
    <rect x="12" y="29" width="28" height="4.5" rx="1.75"/>
    <rect x="14" y="36.5" width="3.2" height="10" rx="1.6"/>
    <rect x="19.3" y="36.5" width="3.2" height="15" rx="1.6"/>
    <rect x="24.6" y="36.5" width="3.2" height="8" rx="1.6"/>
    <rect x="29.9" y="36.5" width="3.2" height="16" rx="1.6"/>
    <rect x="35.2" y="36.5" width="3.2" height="9" rx="1.6"/>
  </g>

  <text x="196" y="156" font-family="Segoe UI, Segoe UI Variable Display, Arial, sans-serif"
        font-size="64" font-weight="700" letter-spacing="-2.4" fill="#EAF2F7">PaperRL</text>
  <text x="198" y="194" font-family="Segoe UI, Segoe UI Variable Display, Arial, sans-serif"
        font-size="24" font-weight="500" fill="#9FB2C4">Reinforcement learning trading desk in Rust</text>

  <rect x="96" y="238" width="1088" height="1" fill="url(#rule)"/>

  <text x="96" y="336" font-family="Segoe UI, Segoe UI Variable Display, Arial, sans-serif"
        font-size="48" font-weight="650" letter-spacing="-1.4" fill="#EAF2F7">Verdicts with the reasoning shown.</text>
  <text x="96" y="398" font-family="Segoe UI, Segoe UI Variable Display, Arial, sans-serif"
        font-size="48" font-weight="650" letter-spacing="-1.4" fill="#EAF2F7">Backtests you can reproduce.</text>

  <g font-family="Segoe UI, Segoe UI Variable Display, Arial, sans-serif" font-size="19" font-weight="600">
    <g>
      <rect x="96" y="452" width="212" height="52" rx="12" fill="#08B98B" fill-opacity="0.12" stroke="#08B98B" stroke-opacity="0.5"/>
      <text x="116" y="484" fill="#10D69E">BUY</text>
      <text x="166" y="484" fill="#EAF2F7">AAPL</text>
      <text x="243" y="484" fill="#9FB2C4">97%</text>
    </g>
    <g>
      <rect x="324" y="452" width="248" height="52" rx="12" fill="#F2685C" fill-opacity="0.1" stroke="#F2685C" stroke-opacity="0.45"/>
      <text x="344" y="484" fill="#F2685C">SELL</text>
      <text x="400" y="484" fill="#EAF2F7">BTC/USD</text>
      <text x="503" y="484" fill="#9FB2C4">91%</text>
    </g>
    <g>
      <rect x="588" y="452" width="222" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="608" y="484" fill="#EAF2F7">116 tests passing</text>
    </g>
  </g>

  <text x="96" y="592" font-family="Segoe UI, Segoe UI Variable Display, Arial, sans-serif"
        font-size="18" font-weight="500" fill="#64748B">github.com/kingabzpro/PaperRL</text>
  <text x="1184" y="592" text-anchor="end" font-family="Segoe UI, Segoe UI Variable Display, Arial, sans-serif"
        font-size="18" font-weight="500" fill="#64748B">Alpaca paper API only</text>
</svg>
